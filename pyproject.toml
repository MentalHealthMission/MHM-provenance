[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhm-provenance"
version = "0.1.0"
description = "Reusable Mental Health Mission provenance primitives"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
object-store = [
  "boto3==1.35.45",
  "botocore==1.35.45",
]

[tool.setuptools.packages.find]
include = ["mhm_core.provenance*"]
namespaces = true
